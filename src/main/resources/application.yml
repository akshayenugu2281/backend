spring:
  application:
    name: library360-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:dpg-db6rqqd9fdbs73e4g25g-a}:${DB_PORT:5432}/${DB_NAME:library360_database}?sslmode=${DB_SSL_MODE:prefer}}}}
    username: ${DB_USER:${DB_USERNAME:${POSTGRES_USER:library360_database_user}}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:hm6X6dswMOrsUVnvi5Y2kLxMdnYUSUw1}}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  auth:
    refresh-cookie-secure: ${COOKIE_SECURE:true}
    refresh-cookie-same-site: ${COOKIE_SAME_SITE:}
  jwt:
    issuer: library360
    secret: ${JWT_SECRET:ZXoIpXA0Hpvqcgzd8JmfNdR57ovFql0cE5+og0NC8WXZGJFbfJaM28x5HzeNijtN}
    access-ttl: 15m
    refresh-ttl: 7d

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://library360-library360upgraded.vercel.app,https://*.vercel.app,https://*.onrender.com}

  seed:
    admin-email: ${ADMIN_EMAIL:admin@library360.local}
    admin-password: ${ADMIN_PASSWORD:Tuv300t10}
    librarian-email: ${LIBRARIAN_EMAIL:librarian@library360.local}
    librarian-password: ${LIBRARIAN_PASSWORD:tuv300t10}

  timezone: UTC
  settings-encryption-key: ${APP_SETTINGS_ENCRYPTION_KEY:Qk9zYkFhZ3d4d3h5c2VjcmV0a2V5c2VjdXJlMTIzNDU2Nzg5MA==}
  ai:
    default-model: ${APP_AI_DEFAULT_MODEL:openai/gpt-4o-mini}

server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.library360: INFO
    org.springframework.security: WARN
