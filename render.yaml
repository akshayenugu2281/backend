# ==============================================================================
# Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  - name: library360-postgres
    databaseName: library360
    user: library360
    plan: free
    region: oregon
    ipAllowList: [] # Allows connections from all Render internal services

services:
  - type: web
    name: library360-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      # Database connection automatically wired from Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: library360-postgres
          property: connectionString

      - key: PORT
        value: 8081

      # CORS & Frontend Origins (update with your live Vercel/frontend domain)
      - key: CORS_ORIGINS
        value: https://library360-library360upgraded.vercel.app,http://localhost:5173

      # Cookie settings for cross-domain auth between Render API and Vercel frontend
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None

      # Cryptographic secrets automatically generated by Render
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SETTINGS_ENCRYPTION_KEY
        generateValue: true

      # Default Admin and Librarian seed credentials
      - key: ADMIN_EMAIL
        value: admin@library360.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: LIBRARIAN_EMAIL
        value: librarian@library360.local
      - key: LIBRARIAN_PASSWORD
        sync: false

      - key: APP_AI_DEFAULT_MODEL
        value: openai/gpt-4o-mini
